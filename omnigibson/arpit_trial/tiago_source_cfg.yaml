# Absolute path to URDF
urdf_path: /home/jdw/projects/repo/OmniGibson/omnigibson/data/assets/source/tiago/tiago_source.urdf                      # (str) Absolute path to robot URDF to import
name: tiago                           # (str) Name to assign to robot
headless: false                          # (bool) if set, run without GUI
overwrite: true                         # (bool) if set, overwrite any existing files
base_motion:
  wheel_links:                      # (list of str): links corresponding to wheels
    - wheel_rear_right_link
    - wheel_rear_left_link
    - wheel_front_right_link
    - wheel_front_left_link
  wheel_joints:                     # (list of str): joints corresponding to wheel motion
    - suspension_rear_right_joint
    - suspension_rear_left_joint
    - suspension_front_right_joint
    - suspension_front_left_joint
    - wheel_rear_right_joint
    - wheel_rear_left_joint
    - wheel_front_right_joint
    - wheel_front_left_joint
  use_sphere_wheels: false           # (bool) whether to use sphere approximation for wheels (better stability)
  use_holonomic_joints: true       # (bool) whether to use joints to approximate a holonomic base. In this case, all
                                    #       wheel-related joints will be made into fixed joints, and 6 additional
                                    #       "virtual" joints will be added to the robot's base capturing 6DOF movement,
                                    #       with the (x,y,rz) joints being controllable by motors
collision:
  decompose_method: coacd                  # (str) [coacd, convex, or null] default collision decomposition method
  hull_count: 8                     # (int) per-mesh max hull count to use during decomposition, only relevant for coacd
  coacd_links: []                   # (list of str): links that should use CoACD to decompose collision meshes
  convex_links:                     # (list of str): links that should use convex hull to decompose collision meshes
    - base_link
    - arm_left_1_link
    - arm_left_2_link
    - arm_left_5_link
    - arm_left_6_link
    - gripper_left_link
    - arm_right_1_link
    - arm_right_2_link
    - arm_right_5_link
    - arm_right_6_link
    - gripper_right_link
    - head_1_link
    - head_2_link
  no_decompose_links:               # (list of str): links that should not have any post-processing done to them
    - wheel_rear_right_link
    - wheel_rear_left_link
    - wheel_front_right_link
    - wheel_front_left_link
    - torso_fixed_colum_link
    - torso_fixed_link
    - torso_lift_link
  no_collision_links:               # (list of str) links that will have any associated collision meshes removed
    - base_antenna_left_link
    - base_antenna_right_link
    - base_dock_link
    - base_front_laser_link
    - base_rear_laser_link
    - suspension_rear_left_link
    - suspension_rear_right_link
    - suspension_front_left_link
    - suspension_front_right_link
    - arm_left_7_link
    - arm_left_tool_link
    - wrist_left_ft_link
    - wrist_left_ft_tool_link
    - arm_right_7_link
    - arm_right_tool_link
    - wrist_right_ft_link
    - wrist_right_ft_tool_link
eef_vis_links:                      # (list of dict) information for adding cameras to robot
  - link: left_eef_link          # same format as @camera_links
    parent_link: gripper_left_grasping_frame
    offset:
      position: [0.07, 0, 0]
      orientation: [0, 0.707, 0, 0.707]
  - link: right_eef_link          # same format as @camera_links
    parent_link: gripper_right_grasping_frame
    offset:
      position: [0.07, 0, 0]
      orientation: [0, 0.707, 0, 0.707]
camera_links:                       # (list of dict) information for adding cameras to robot
  - link: eyes                      # (str) link name to add camera. Must exist if @parent_link is null, else will be
                                    #       added as a child of the parent
    parent_link: null               # (str) optional parent link to use if adding new link
    offset:                         # (dict) local pos,ori offset values. if @parent_link is specified, defines offset
                                    #       between @parent_link and @link specified in @parent_link's frame.
                                    #       Otherwise, specifies offset of generated prim relative to @link's frame
      position: [0.02, 0, 0]           # (3-tuple) (x,y,z) offset -- this is done BEFORE the rotation
      orientation: [0.5, -0.5, -0.5, 0.5]   # (4-tuple) (x,y,z,w) offset
  - link: left_eef_link
    parent_link: null
    offset:
      position: [0.05, 0, -0.05]
      orientation: [-0.7011, -0.7011, -0.0923, -0.0923]
  - link: right_eef_link
    parent_link: null
    offset:
      position: [0.05, 0, -0.05]
      orientation: [-0.7011, -0.7011, -0.0923, -0.0923]
lidar_links:                        # (list of dict) information for adding cameras to robot
  - link: base_front_laser_link                # same format as @camera_links
    parent_link: null
    offset:
      position: [0, 0, 0]
      orientation: [0, 0, 0, 1.0]
  - link: base_rear_laser_link                # same format as @camera_links
    parent_link: null
    offset:
      position: [0, 0, 0]
      orientation: [0, 0, 0, 1.0]
curobo:
  eef_to_gripper_info:                        # (dict) Maps EEF link name to corresponding gripper links / joints
    right_eef_link:
      links: ["gripper_right_left_finger_link", "gripper_right_right_finger_link"]
      joints: ["gripper_right_left_finger_joint", "gripper_right_right_finger_joint"]
    left_eef_link:
      links: ["gripper_left_left_finger_link", "gripper_left_right_finger_link"]
      joints: ["gripper_left_left_finger_joint", "gripper_left_right_finger_joint"]
  lock_joints:                                # (dict) Maps joint name to "locked" joint configuration. Any joints
                                              #       specified here will not be considered active when motion planning
                                              #       NOTE: All gripper joints and non-controllable holonomic joints
                                              #       # will automatically here
    head_1_joint: 0.0
    head_2_joint: -0.45
  self_collision_ignore:                      # (dict) Maps link name to list of other ignore links to ignore collisions
                                              #       with. Note that bi-directional specification is not necessary,
                                              #       e.g.: "torso_link1" does not need to be specified in
                                              #       "torso_link2"'s list if "torso_link2" is already specified in
                                              #       "torso_link1"'s list
    base_link: ["torso_lift_link", "wheel_front_left_link", "wheel_front_right_link", "wheel_rear_left_link", "wheel_rear_right_link", "torso_fixed_column_link"]
    torso_fixed_column_link: ["torso_lift_link"]
    torso_lift_link: ["arm_left_1_link", "arm_right_1_link", "arm_left_2_link", "arm_right_2_link", "head_1_link", "head_2_link"]
    arm_left_1_link: ["arm_left_2_link", "arm_left_3_link"]
    arm_left_2_link: ["arm_left_3_link"]
    arm_left_3_link: ["arm_left_4_link"]
    arm_left_4_link: ["arm_left_5_link"]
    arm_left_5_link: ["arm_left_6_link", "gripper_left_link"]
    arm_left_6_link: ["gripper_left_link"]
    gripper_left_link: ["gripper_left_left_finger_link", "gripper_left_right_finger_link"]
    gripper_left_left_finger_link: ["gripper_left_right_finger_link"]
    arm_right_1_link: ["arm_right_2_link", "arm_right_3_link"]
    arm_right_2_link: ["arm_right_3_link"]
    arm_right_3_link: ["arm_right_4_link"]
    arm_right_4_link: ["arm_right_5_link"]
    arm_right_5_link: ["arm_right_6_link", "gripper_right_link"]
    arm_right_6_link: ["gripper_right_link"]
    gripper_right_link: ["gripper_right_left_finger_link", "gripper_right_right_finger_link"]
    gripper_right_left_finger_link: ["gripper_right_right_finger_link"]
    head_1_link: ["head_2_link"]
  collision_spheres:                          # (dict) Maps link name to list of collision sphere representations,
                                              #       where each sphere is defined by its (x,y,z) "center" and "radius"
                                              #       values. This defines the collision geometry during motion planning
